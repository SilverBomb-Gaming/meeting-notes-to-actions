[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notes-to-actions"
version = "0.1.0"
description = "Local-first CLI that turns meeting notes into action items, decisions, and open questions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alfredo Cardona" }]
keywords = ["meeting-notes", "action-items", "ollama", "cli", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
meeting-actions = "meeting_actions.cli:app"

[project.urls]
Homepage = "https://github.com/SilverBomb-Gaming/meeting-notes-to-actions"
Repository = "https://github.com/SilverBomb-Gaming/meeting-notes-to-actions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
